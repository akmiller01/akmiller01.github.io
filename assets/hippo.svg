<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480">
  <defs>
    <clipPath id="belly">
      <path d="M 245 310 L 395 310 L 395 381.24 A 200 120 0 0 1 245 381.24 Z"/>
    </clipPath>
  </defs>
  <!-- background -->
  <rect width="640" height="480" fill="#e6d8f5"/>
  <!-- ground -->
  <ellipse cx="320" cy="430" rx="300" ry="45" fill="#b5d6a8"/>

  <!-- tail -->
  <path d="M120 250 Q70 260 60 300 Q90 285 125 285 Z" fill="#9b7fb5"/>

  <!-- back legs -->
  <rect x="150" y="300" width="55" height="110" rx="27" fill="#7a5c99"/>
  <rect x="430" y="300" width="55" height="110" rx="27" fill="#7a5c99"/>

  <!-- body -->
  <ellipse cx="320" cy="270" rx="200" ry="120" fill="#a98cc4"/>

  <!-- belly stripes -->
  <g clip-path="url(#belly)" fill="#cbb5e2">
    <rect x="255" y="310" width="12" height="80"/>
    <rect x="285" y="310" width="12" height="80"/>
    <rect x="315" y="310" width="12" height="80"/>
    <rect x="345" y="310" width="12" height="80"/>
    <rect x="375" y="310" width="12" height="80"/>
  </g>

  <!-- front legs -->
  <rect x="190" y="310" width="55" height="110" rx="27" fill="#a98cc4"/>
  <rect x="395" y="310" width="55" height="110" rx="27" fill="#a98cc4"/>

  <!-- feet -->
  <ellipse cx="217" cy="420" rx="35" ry="14" fill="#7a5c99"/>
  <ellipse cx="422" cy="420" rx="35" ry="14" fill="#7a5c99"/>

  <!-- ears -->
  <circle cx="455" cy="130" r="22" fill="#a98cc4"/>
  <circle cx="455" cy="130" r="12" fill="#f5a9d0"/>
  <circle cx="545" cy="130" r="22" fill="#a98cc4"/>
  <circle cx="545" cy="130" r="12" fill="#f5a9d0"/>

  <!-- head -->
  <ellipse cx="500" cy="210" rx="110" ry="95" fill="#a98cc4"/>

  <!-- snout -->
  <ellipse cx="520" cy="255" rx="95" ry="60" fill="#b89ad1"/>

  <!-- nostrils -->
  <ellipse cx="480" cy="240" rx="10" ry="7" fill="#5c3d7a"/>
  <ellipse cx="560" cy="240" rx="10" ry="7" fill="#5c3d7a"/>

  <!-- eyes -->
  <circle cx="460" cy="180" r="14" fill="#3a4656"/>
  <circle cx="465" cy="175" r="4" fill="#ffffff"/>
  <circle cx="545" cy="180" r="14" fill="#3a4656"/>
  <circle cx="550" cy="175" r="4" fill="#ffffff"/>

  <!-- smile -->
  <path d="M480 290 Q520 315 560 290" fill="none" stroke="#5c3d7a" stroke-width="5" stroke-linecap="round"/>

  <!-- teeth -->
  <rect x="495" y="300" width="18" height="16" rx="4" fill="#ffffff"/>
  <rect x="527" y="300" width="18" height="16" rx="4" fill="#ffffff"/>
</svg>
